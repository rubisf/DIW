<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tema 8 Ej 1: Inputs Básicos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
        <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Formulario de Contacto</h1>

        <form action="#">
            <!-- REQUISITO 1 & 2: Input de texto con clases border p-2 rounded w-full mb-4 -->
            <div>
                <label for="nombre" class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre..."
                    class="border p-2 rounded w-full mb-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <!-- REQUISITO 1 & 2: Input de email con clases border p-2 rounded w-full mb-4 -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com"
                    class="border p-2 rounded w-full mb-4 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>

            <button type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition-colors shadow-md">
                Enviar Datos
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-100">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Clases Aplicadas:</h3>
            <div class="flex flex-wrap gap-2 text-[10px]">
                <span class="bg-slate-200 px-2 py-1 rounded-md text-slate-600">border</span>
                <span class="bg-slate-200 px-2 py-1 rounded-md text-slate-600">p-2</span>
                <span class="bg-slate-200 px-2 py-1 rounded-md text-slate-600">rounded</span>
                <span class="bg-slate-200 px-2 py-1 rounded-md text-slate-600">w-full</span>
                <span class="bg-slate-200 px-2 py-1 rounded-md text-slate-600">mb-4</span>
            </div>
        </div>
    </div>

</body>

</html>
