<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T8 Ej4: Inputs Interactivos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733', 
              primary: '#1c64f2',
              secondary: '#10b981'
            },
            fontFamily: {
                custom: ['Georgia', 'serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition-all duration-300; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6 dark:bg-gray-900 transition-colors duration-300">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg mt-10">
        <h2 class="text-2xl font-bold mb-6 text-gray-700 text-center">Contáctanos</h2>
        <form class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" class="border p-3 rounded w-full bg-gray-50 focus:outline-none focus:ring-4 focus:ring-blue-400 focus:bg-white transition-all" placeholder="nombre@correo.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">País</label>
                <select class="border p-3 rounded w-full bg-gray-50 focus:ring-4 focus:ring-blue-400">
                    <option>España</option>
                    <option>Andorra</option>
                    <option>Otro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mensaje Privado</label>
                <textarea class="border p-3 rounded w-full bg-gray-50 focus:outline-none focus:ring-4 focus:ring-blue-400 focus:bg-white resize-none" rows="4" placeholder="Dejanos un comentario..."></textarea>
            </div>
            <button type="button" class="btn mt-2 font-bold">Enviar Formulario</button>
        </form>
    </div>
</body>
</html>
