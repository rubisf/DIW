<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tema 8 Ej 6: Layout de Formulario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4 md:p-8">

    <div
        class="max-w-4xl w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row border border-white/10">

        <!-- Lateral Decorativo (Solo escritorio) -->
        <div
            class="hidden md:flex md:w-1/3 bg-indigo-600 p-12 text-white flex-col justify-between relative overflow-hidden">
            <div class="relative z-10">
                <h2 class="text-3xl font-bold mb-4 text-indigo-100">Contáctanos</h2>
                <p class="text-indigo-200 opacity-80 leading-relaxed">
                    Estamos aquí para ayudarte a escalar tus proyectos al siguiente nivel.
                </p>
            </div>
            <div class="relative z-10 text-xs font-medium text-indigo-300 uppercase tracking-widest">
                © Tailwind Studio
            </div>
            <!-- Círculos decorativos -->
            <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-indigo-500 rounded-full opacity-30"></div>
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-400 rounded-full opacity-20"></div>
        </div>

        <!-- Formulario Principal -->
        <div class="flex-1 p-8 md:p-12">
            <header class="mb-10 text-center md:text-left">
                <h1 class="text-2xl font-bold text-slate-800">Enviar un Mensaje</h1>
                <p class="text-slate-400 text-sm mt-1">Responderemos en menos de 24 horas.</p>
            </header>

            <form action="#" class="space-y-6">
                <!-- REQUISITO 2: grid grid-cols-1 md:grid-cols-2 gap-4 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <!-- REQUISITO 1.1: Nombre -->
                    <div class="space-y-2">
                        <label for="nombre" class="text-sm font-semibold text-slate-700 ml-1">Nombre</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre"
                            class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300">
                    </div>

                    <!-- REQUISITO 1.2: Apellido -->
                    <div class="space-y-2">
                        <label for="apellido" class="text-sm font-semibold text-slate-700 ml-1">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Tu apellido"
                            class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300">
                    </div>

                    <!-- REQUISITO 1.3: Email (Ocupa las 2 columnas en desktop si queremos, o 1. El enunciado dice Nombre, Apell, Email, Mensaje) -->
                    <div class="md:col-span-2 space-y-2">
                        <label for="email" class="text-sm font-semibold text-slate-700 ml-1">Email</label>
                        <input type="email" id="email" name="email" placeholder="hola@ejemplo.com"
                            class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300">
                    </div>

                    <!-- REQUISITO 1.4: Mensaje -->
                    <div class="md:col-span-2 space-y-2">
                        <label for="mensaje" class="text-sm font-semibold text-slate-700 ml-1">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" placeholder="¿En qué podemos ayudarte?"
                            class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all placeholder:text-slate-300 resize-none"></textarea>
                    </div>
                </div>

                <!-- REQUISITO 4: Botón de enviar al final -->
                <div class="pt-4">
                    <button type="submit"
                        class="w-full bg-slate-900 text-white font-bold py-4 rounded-xl hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/20 active:scale-[0.98] flex items-center justify-center gap-2">
                        <span>Enviar Mensaje</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 opacity-70" viewBox="0 0 20 20"
                            fill="currentColor">
                            <path
                                d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Indicador de responsive (Depuración visual) -->
    <div
        class="fixed bottom-4 right-4 bg-slate-800 text-white px-3 py-1 rounded-full text-[10px] font-bold opacity-50 pointer-events-none">
        <span class="md:hidden">MODO MÓVIL (grid-cols-1)</span>
        <span class="hidden md:block">MODO ESCRITORIO (grid-cols-2)</span>
    </div>

</body>

</html>
