<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T8 Ej5: Errores y Validaciones</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733', 
              primary: '#1c64f2',
              secondary: '#10b981'
            },
            fontFamily: {
                custom: ['Georgia', 'serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition-all duration-300; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6 dark:bg-gray-900 transition-colors duration-300">
        <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow mt-10">
        <h2 class="text-xl font-bold mb-6">Validación Visual</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Input Deshabilitado</label>
            <input type="text" value="Solo lectura" disabled class="border p-3 rounded w-full bg-gray-100 opacity-60 cursor-not-allowed">
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-red-600 mb-1">Contraseña (Mínimo 8)</label>
            <input type="password" value="123" class="border border-red-500 p-3 rounded w-full bg-red-50 focus:outline-none focus:ring-4 focus:ring-red-200 text-red-900">
            <p class="text-red-500 text-sm mt-1 font-semibold">Error: La contraseña es demasiado corta.</p>
        </div>
    </div>
</body>
</html>
