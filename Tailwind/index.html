    <script>
        function loadIframe(element) {
            // Actualizar active state de la nevegación
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.classList.remove('bg-sky-500', 'text-white', 'font-bold');
                btn.classList.add('text-gray-700', 'hover:bg-gray-100');
            });
            element.classList.remove('text-gray-700', 'hover:bg-gray-100');
            element.classList.add('bg-sky-500', 'text-white', 'font-bold');

            // Cargar URL en el iframe
            const url = element.getAttribute('data-url');
            document.getElementById('viewer').src = url;

            // Actualizar UI del iframe contenedor superior
            document.getElementById('currentTitle').innerText = element.innerText;
            document.getElementById('extLink').href = url;
        }
    </script>
