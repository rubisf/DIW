<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW Ej5: Card Básico</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <h1 class="text-2xl font-bold mb-4">Ejercicio 5: Card con Tailwind</h1>
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm mx-auto border border-gray-100">
        <h2 class="text-xl font-bold text-gray-800 mb-2">Título de Tarjeta</h2>
        <p class="text-gray-600">Texto de ejemplo que ocupa varias líneas dando volumen a la tarjeta desarrollada únicamente con clases utilitarias de Tailwind.</p>
    </div>
</body>
</html>
