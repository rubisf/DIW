<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T7 Ej2: Clases Reutilizables (@Apply)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733', 
              primary: '#1c64f2',
              secondary: '#10b981'
            },
            fontFamily: {
                custom: ['Georgia', 'serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition-all duration-300; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6 dark:bg-gray-900 transition-colors duration-300">
        <h1 class="text-xl mb-4 font-semibold text-center">Reutilización con apply (.card y .btn)</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl mx-auto">
        <div class="card">
            <h2 class="text-xl font-bold mb-2">Producto Alpha</h2>
            <p class="text-gray-600 mb-4">Descripción concisa.</p>
            <button class="btn w-full">Comprar Alpha</button>
        </div>
        <div class="card">
            <h2 class="text-xl font-bold mb-2">Producto Bravo</h2>
            <p class="text-gray-600 mb-4">Características únicas.</p>
            <button class="btn w-full">Comprar Bravo</button>
        </div>
    </div>
</body>
</html>
