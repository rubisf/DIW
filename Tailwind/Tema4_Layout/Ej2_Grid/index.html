<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T4 Ej2: Grid Básico</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <h1 class="text-xl mb-4 font-semibold text-center">CSS Grid de 3 Columnas y 2 Filas</h1>
    <div class="grid grid-cols-3 grid-rows-2 gap-4 bg-gray-100 p-6 rounded-lg">
        <div class="bg-pink-300 p-4 text-center font-bold shadow-sm rounded">1</div>
        <div class="bg-orange-300 p-4 text-center font-bold shadow-sm rounded">2</div>
        <div class="bg-indigo-300 p-4 text-center font-bold shadow-sm rounded row-span-2 flex items-center justify-center">3 (Row Span)</div>
        <div class="bg-yellow-300 p-4 text-center font-bold shadow-sm rounded col-span-2">4 (Col Span)</div>
    </div>
</body>
</html>
