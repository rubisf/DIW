<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T4 Ej5: Overflow y Z-Index</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <h1 class="text-xl mb-4 font-semibold text-center">Overflow y Z-Index</h1>
    <div class="relative w-64 h-48 overflow-auto bg-gray-200 p-4 mx-auto border-2 border-gray-400 rounded">
        <div class="h-24 bg-teal-200 mb-2 p-2 shadow z-10 relative">Caja Regular (z-10)</div>
        <div class="h-24 bg-purple-200 mb-2 p-2 shadow absolute top-10 left-10 w-40 z-50 transform rotate-12">Caja Flotante (z-50) Superpuesta</div>
        <div class="h-24 bg-pink-200 mb-2 p-2 shadow">Más contenido para causar scroll...</div>
        <div class="h-24 bg-yellow-200 mb-2 p-2 shadow">Último del scroll...</div>
    </div>
</body>
</html>
