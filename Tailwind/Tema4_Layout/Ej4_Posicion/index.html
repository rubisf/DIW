<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T4 Ej4: Positioning Absolute</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <h1 class="text-xl mb-4 font-semibold text-center">Posicionamiento Absoluto/Relativo</h1>
    <div class="relative w-full max-w-lg mx-auto h-48 bg-gray-800 rounded shadow-lg overflow-hidden">
        <div class="absolute top-0 right-0 bg-red-500 text-white p-2 text-xs font-bold rounded-bl font-mono">top-0 right-0</div>
        <div class="absolute bottom-0 left-0 bg-green-500 text-white p-2 text-xs font-bold rounded-tr font-mono">bottom-0 left-0</div>
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-blue-500 text-white px-4 py-2 font-bold rounded shadow-md">Centro Perfecto</div>
    </div>
</body>
</html>
