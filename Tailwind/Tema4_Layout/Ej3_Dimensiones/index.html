<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T4 Ej3: Width & Height</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <div class="w-full h-screen bg-slate-800 flex items-center justify-center text-white">
        <div class="w-1/2 md:w-1/3 xl:w-1/4 h-64 bg-cyan-600 rounded-xl shadow-2xl flex flex-col items-center justify-center mx-auto my-8 p-6 text-center transition-all hover:w-2/3">
            <h2 class="text-2xl font-bold">Dimensiones Fluidas</h2>
            <p class="mt-2 opacity-80">Mi altura está predefinida, pero mi anchura cambia.</p>
        </div>
    </div>
</body>
</html>
