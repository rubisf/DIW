<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T9 Ej4: Animaciones Listas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733', 
              primary: '#1c64f2',
              secondary: '#10b981'
            },
            fontFamily: {
                custom: ['Georgia', 'serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition-all duration-300; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300 focus:outline-none focus:ring-4 focus:ring-blue-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6 dark:bg-gray-900 transition-colors duration-300">
        <div class="flex gap-10 justify-center items-center mt-20">
        <div class="w-32 h-32 bg-rose-500 rounded-full flex items-center justify-center text-white font-bold animate-pulse shadow-xl shadow-rose-200">
            Pulse
        </div>
        <div class="w-32 h-32 bg-amber-400 rounded-xl flex items-center justify-center text-white font-bold animate-bounce shadow-xl shadow-amber-200">
            Bounce
        </div>
        <div class="w-32 h-32 border-4 border-dashed border-cyan-500 rounded-full flex items-center justify-center font-bold text-cyan-600 animate-spin">
            Spin
        </div>
    </div>
</body>
</html>
