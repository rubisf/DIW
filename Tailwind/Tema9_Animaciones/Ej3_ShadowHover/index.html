<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tema 9 Ej 3: Shadow & Scale Hover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-md w-full">
        <h1 class="text-2xl font-bold text-slate-800 mb-8">Efectos de Elevación</h1>

        <!-- REQUISITO 1: Tarjeta con sombra inicial, sombra más grande al hover y pequeño scale -->
        <!-- REQUISITO 2: transition-all duration-300 -->
        <div
            class="bg-white p-8 rounded-3xl shadow-md hover:shadow-2xl hover:scale-105 transition-all duration-300 cursor-pointer border border-slate-100 group">
            <div
                class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mb-6 mx-auto group-hover:bg-blue-500 transition-colors duration-300">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-8 w-8 text-blue-600 group-hover:text-white transition-colors duration-300" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </div>

            <h2 class="text-xl font-bold text-slate-900 mb-3 text-balance">Tarjeta Interactiva</h2>
            <p class="text-slate-500 text-sm leading-relaxed mb-6">
                Pasa el ratón por encima para observar cómo la sombra se expande y la tarjeta se eleva suavemente.
            </p>

            <div class="flex justify-center gap-2">
                <span class="bg-slate-50 text-slate-400 text-[10px] font-bold px-2 py-1 rounded">shadow-md</span>
                <span class="bg-blue-50 text-blue-400 text-[10px] font-bold px-2 py-1 rounded">hover:shadow-2xl</span>
                <span class="bg-amber-50 text-amber-500 text-[10px] font-bold px-2 py-1 rounded">hover:scale-105</span>
            </div>
        </div>

        <p class="mt-12 text-slate-400 text-sm italic">
            "La combinación de elevación y escalado crea una jerarquía visual instantánea."
        </p>
    </div>

</body>

</html>
