<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Tema 5 Ej 2: Visibilidad Responsive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="bg-indigo-950 text-white min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div
        class="max-w-md w-full border-2 border-dashed border-indigo-400/30 rounded-3xl p-12 space-y-8 bg-indigo-900/20 backdrop-blur-sm">
        <h1 class="text-3xl font-bold text-indigo-300 mb-4">Control de Visibilidad</h1>

        <!-- REQUISITO: Bloque visible solo en móvil (md:hidden) -->
        <div
            class="block md:hidden p-8 bg-gradient-to-br from-pink-500 to-rose-600 rounded-2xl shadow-xl shadow-pink-500/20 animate-pulse">
            <span class="text-5xl mb-4 block">📱</span>
            <p class="text-2xl font-bold">Solo móvil</p>
            <p class="text-sm opacity-80 mt-2">Viewport < 768px</p>
        </div>

        <!-- REQUISITO: Bloque visible solo en escritorio (md:block) -->
        <div
            class="hidden md:block p-8 bg-gradient-to-br from-sky-500 to-indigo-600 rounded-2xl shadow-xl shadow-sky-500/20">
            <span class="text-5xl mb-4 block">💻</span>
            <p class="text-2xl font-bold">Solo escritorio</p>
            <p class="text-sm opacity-80 mt-2">Viewport >= 768px</p>
        </div>

        <div class="pt-6 border-t border-indigo-500/20">
            <p class="text-slate-400 text-sm">
                Redimensiona la ventana del navegador para alternar entre los estados.
            </p>
            <div class="mt-4 flex justify-center gap-2">
                <code class="bg-indigo-800/50 px-2 py-1 rounded text-xs">md:hidden</code>
                <code class="bg-indigo-800/50 px-2 py-1 rounded text-xs">md:block</code>
            </div>
        </div>
    </div>

</body>

</html>
