<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T5 Ej5: Tipografía Adaptable</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <div class="flex flex-col items-center justify-center min-h-[50vh] bg-gray-900 text-white rounded-xl shadow-2xl p-6">
        <h1 class="font-bold transition-all duration-300 text-base md:text-2xl lg:text-4xl xl:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
            Tipografía Fluida Responsiva
        </h1>
        <p class="mt-4 text-xs md:text-sm lg:text-base xl:text-lg text-gray-400 max-w-3xl text-center">
            Este párrafo y el título cambian su peso y tamaño dependiendo del ancho del dispositivo, asegurando una lectura perfecta en cualquier pantalla.
        </p>
    </div>
</body>
</html>
