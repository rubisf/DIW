<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW T5 Ej1: Breakpoints de Color</title>
    <!-- Tailwind CSS (Play CDN para agilizar visualización directa) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: '#ff5733',
              primary: '#1c64f2'
            },
            fontFamily: {
                custom: ['Arial', 'sans-serif']
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .card { @apply bg-white p-6 rounded-lg shadow-md; }
        .btn { @apply bg-blue-500 text-white p-3 rounded hover:bg-blue-600 active:bg-blue-700 transition duration-300; }
      }
    </style>
</head>
<body class="bg-gray-50 p-6 flex flex-col gap-6">
        <h1 class="text-xl mb-4 font-semibold text-center">Redimensiona la ventana (Breakpoints)</h1>
    <div class="h-64 w-full flex items-center justify-center text-3xl font-black text-gray-800 transition-colors duration-500
                bg-blue-300 
                sm:bg-green-300 
                md:bg-red-300 
                lg:bg-yellow-300 
                xl:bg-pink-300">
        <span class="block sm:hidden">Móvil (< 640px)</span>
        <span class="hidden sm:block md:hidden">SM (640px+)</span>
        <span class="hidden md:block lg:hidden">MD (768px+)</span>
        <span class="hidden lg:block xl:hidden">LG (1024px+)</span>
        <span class="hidden xl:block">XL (1280px+)</span>
    </div>
</body>
</html>
