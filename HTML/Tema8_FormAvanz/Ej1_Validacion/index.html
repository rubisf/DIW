<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Validación Nativa</title>
</head>
<body>
        <h2>Alta de Usuario</h2>
    <form action="#" method="post">
        <label for="nom">Nombre (Mín 3 chars):</label>
        <input type="text" id="nom" name="nom" minlength="3" required><br><br>
        
        <label for="correo">Email:</label>
        <input type="email" id="correo" name="correo" required><br><br>
        
        <label for="ed">Edad (18-65):</label>
        <input type="number" id="ed" name="ed" min="18" max="65" required><br><br>
        
        <button type="submit">Dar de Alta</button>
    </form>
</body>
</html>
