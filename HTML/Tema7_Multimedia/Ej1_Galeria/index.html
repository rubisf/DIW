<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Figcaption</title>
</head>
<body>
        <h2>Galería de Naturaleza</h2>
    <div style="display:flex; gap:10px;">
        <figure>
            <img src="../../../img/product.png" alt="Bosque brumoso y verde" width="300">
            <figcaption>Bosque en la madrugada.</figcaption>
        </figure>
        <figure>
            <img src="../../../img/product.png" alt="Montañas soleadas con lago nevado" width="300">
            <figcaption>Reflejos de la montaña.</figcaption>
        </figure>
        <figure>
            <img src="../../../img/product.png" alt="Viajero por parajes increíbles" width="300">
            <figcaption>Explorando nuevos mundos.</figcaption>
        </figure>
    </div>
</body>
</html>
