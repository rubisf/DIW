<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural Multimedia</title>
</head>
<body>
        <header>
        <h1>Portal de Recursos Geográficos</h1>
    </header>
    <main>
        <section>
            <h2>Documental</h2>
            <video controls width="500">
                <source src="http://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" type="video/mp4">
                Tu navegador no soporta vídeo.
            </video>
        </section>
        
        <section>
            <h2>Imágenes de Expedición</h2>
            <figure style="float:left; margin-right:15px;">
                <img src="../../../img/product.png" alt="Mapa antiguo">
                <figcaption>Cartografía del Siglo XIX.</figcaption>
            </figure>
            <p>El estudio cartógrafico revela información clave del entorno sociopolítico.</p>
            <div style="clear:both;"></div>
        </section>
        
        <section>
            <h2>Entrevista Experto (Podcast)</h2>
            <audio controls>
                <source src="https://www.learningcontainer.com/wp-content/uploads/2020/02/Kalimba.mp3" type="audio/mpeg">
            </audio>
        </section>
    </main>
</body>
</html>
