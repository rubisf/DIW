<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Completo</title>
</head>
<body>
        <h2>Iniciar Sesión</h2>
    <form action="#" method="POST">
        <!-- Usuario -->
        <label for="usuario">Usuario:</label>
        <input type="text" id="usuario" name="usuario" placeholder="Nombre de usuario" required><br><br>
        
        <!-- Contraseña -->
        <label for="pwd">Contraseña:</label>
        <input type="password" id="pwd" name="pwd" placeholder="Tu contraseña" required><br><br>
        
        <!-- Recordarme -->
        <input type="checkbox" id="recordar" name="recordar">
        <label for="recordar">Recordar en este equipo</label><br><br>
        
        <input type="submit" value="Ingresar">
    </form>
</body>
</html>
