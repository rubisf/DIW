<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Avanzada</title>
</head>
<body>
        <h2>Encuesta de Satisfacción</h2>
    <form action="#" method="POST">
        <label for="nombre">Añade tu nombre:</label>
        <input type="text" id="nombre" name="nombre"><br><br>
        
        <label for="email">Correo (Opcional):</label>
        <input type="email" id="email" name="email"><br><br>
        
        <label for="nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="nacimiento" name="nacimiento"><br><br>
        
        <label for="color">Elige tu color favorito:</label>
        <input type="color" id="color" name="color"><br><br>
        
        <label for="sat">Satisfacción (1 a 10):</label>
        <input type="range" id="sat" name="sat" min="1" max="10" value="5"><br><br>
        
        <button type="submit">Enviar Encuesta</button>
    </form>
</body>
</html>
