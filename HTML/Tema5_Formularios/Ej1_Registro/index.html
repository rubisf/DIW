<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Básico</title>
</head>
<body>
        <h2>Formulario de Registro</h2>
    <form action="#" method="POST">
        <!-- Campo Nombre -->
        <label for="nombre">Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre"><br><br>
        
        <!-- Campo Apellidos -->
        <label for="apellidos">Apellidos:</label><br>
        <input type="text" id="apellidos" name="apellidos" placeholder="Tus apellidos"><br><br>
        
        <!-- Campo Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="usuario@ejemplo.com"><br><br>
        
        <!-- Botón Enviar -->
        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
