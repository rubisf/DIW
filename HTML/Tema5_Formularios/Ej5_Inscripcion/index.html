<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción Condicionada</title>
</head>
<body>
        <h2>Inscripción a Curso</h2>
    <form action="#" method="POST">
        <label for="n">Nombre:</label> <input type="text" id="n" name="n" required><br>
        <label for="a">Apellidos:</label> <input type="text" id="a" name="a" required><br>
        <label for="e">Email:</label> <input type="email" id="e" name="e" required><br>
        <label for="edad">Edad (18-99):</label> <input type="number" id="edad" name="edad" min="18" max="99" required><br><br>
        
        <label for="curso">Curso a elegir:</label>
        <select id="curso" name="curso" required>
            <option value="">-- Seleccione --</option>
            <option value="1">HTML Básico</option>
            <option value="2">CSS Avanzado</option>
            <option value="3">JavaScript Moderno</option>
        </select><br><br>
        
        <p>Modalidad preferida:</p>
        <input type="radio" id="mod_on" name="modalidad" value="online" checked>
        <label for="mod_on">Online</label><br>
        <input type="radio" id="mod_pr" name="modalidad" value="presencial">
        <label for="mod_pr">Presencial</label><br><br>
        
        <label for="coment">Comentarios adicionales (Max 200 caract.):</label><br>
        <textarea id="coment" name="coment" maxlength="200" rows="3" cols="40"></textarea><br><br>
        
        <button type="submit">Inscribirse</button>
    </form>
</body>
</html>
