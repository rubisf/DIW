        ::-webkit-scrollbar {

        }

        }

        /* Sidebar Native HTML/CSS */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: bold;
            padding: 10px;
            color: #e34f26;
            display: block;
            border-bottom: 2px solid #e34f26;
            margin-bottom: 15px;
        }

        .theme-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #6c757d;
            font-weight: bold;
            margin: 15px 0 5px 10px;
        }

        .nav-link {
            display: block;
            padding: 8px 15px;
            color: #495057;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 2px;
            font-size: 14px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-link:hover {
            background-color: #e9ecef;
        }

        .nav-link.active {
            background-color: #e34f26;
            color: white;
            font-weight: bold;
        }

        /* Main View */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            background: #f8f9fa;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-bar h3 {
            margin: 0;
            color: #212529;
        }

        .btn-link {
            display: inline-block;
            padding: 6px 12px;
            font-size: 14px;
            color: #e34f26;
            border: 1px solid #e34f26;
            border-radius: 4px;
            text-decoration: none;
            transition: 0.2s;
            background: white;
        }

        .btn-link:hover {
            background: #e34f26;
            color: white;
        }

        .iframe-container {
            flex: 1;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

    <script>
        function loadIframe(element) {
            // Actualizar active state
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Cargar URL
            const url = element.getAttribute('data-url');
            document.getElementById('viewer').src = url;

            // Actualizar UI
            document.getElementById('currentTitle').innerText = element.innerText;
            document.getElementById('extLink').href = url;
        }
    </script>
