<!DOCTYPE html>
<!-- IDIOMA DEL DOCUMENTO: Atributo 'lang' en la etiqueta html -->
<html lang="es">

<head>
    <!-- 1. METADATOS BÁSICOS -->
    <meta charset="UTF-8"> <!-- Codificación de caracteres para evitar errores con tildes y ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Responsive: Escala el sitio al ancho del dispositivo -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <!-- Compatibilidad con versiones antiguas de Internet Explorer -->

    <!-- 2. SEO OPTIMIZADO -->
    <title>SaaS Master - La solución definitiva para tu flujo de trabajo</title>
    <!-- Título que aparece en la pestaña y resultados de búsqueda -->
    <meta name="description"
        content="Descubre SaaS Master, la herramienta líder para gestionar proyectos, automatizar tareas y mejorar la productividad de tu equipo en un 40%.">
    <!-- Descripción breve para buscadores -->
    <meta name="keywords" content="productividad, gestión de proyectos, automatización, SaaS, software para equipos">
    <!-- Palabras clave relevantes -->
    <meta name="robots" content="index, follow"> <!-- Instrucciones para los bots: indexar y seguir enlaces -->
    <link rel="canonical" href="https://www.saasmaster.com/">
    <!-- Evita contenido duplicado indicando la URL preferida -->
    <meta name="author" content="Equipo de Desarrollo SaaS">

    <!-- 3. OPEN GRAPH (Para compartir en RRSS como Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:title" content="SaaS Master - Optimiza tu Productividad">
    <meta property="og:description" content="Gestiona tus proyectos de forma inteligente. Prueba gratuita de 14 días.">
    <meta property="og:image" content="https://www.saasmaster.com/assets/og-image.jpg">
    <!-- Imagen que se muestra al compartir el enlace -->
    <meta property="og:url" content="https://www.saasmaster.com/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_ES">

    <!-- 4. TWITTER CARDS -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SaaS Master - Optimiza tu Productividad">
    <meta name="twitter:description" content="Gestiona tus proyectos de forma inteligente. Prueba gratuita de 14 días.">
    <meta name="twitter:image" content="https://www.saasmaster.com/assets/twitter-card.jpg">

    <!-- 5. FAVICON -->
    <link rel="icon" type="image/x-icon" href="favicon.ico"> <!-- Icono clásico para navegadores -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"> <!-- Icono para dispositivos Apple -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

    <!-- Estilos de ejemplo para visualizar el resultado -->
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #f0f4f8;
            color: #102a43;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #243b53;
        }

        .badge {
            background: #dceefb;
            color: #0044b3;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <span class="badge">SEO & Metas OK</span>
        <h1>Ejercicio 3: Head Completo</h1>
        <p>Inspecciona el código fuente (Ctrl+U) para ver todos los metadatos implementados:</p>
        <ul style="text-align: left; line-height: 1.8;">
            <li>SEO (Title, Description, Canonical)</li>
            <li>Open Graph & Twitter Cards</li>
            <li>Favicons</li>
            <li>Robots & Author</li>
        </ul>
    </div>

</body>

</html>
