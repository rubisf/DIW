<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T8_Ej4: Galería Fluida y Object-Fit</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .galeria {
    display: grid;
    /* Galería fluida automática sin Media Queries */
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}
.img-container {
    width: 100%;
    /* Truco para fijar proporción o height (Ej: Cuadrada vs Rectangle) */
    height: 200px; 
    border-radius: 8px;
    overflow: hidden;
    position: relative;
}
.img-responsive {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Para no deformar al reescalar el grid contenedor */
    transition: transform 0.3s;
}
.img-container:hover .img-responsive {
    transform: scale(1.05);
}
    </style>
</head>
<body>
    <p>Galería que se adapta automáticamente al espacio gracias a <code>auto-fit</code> y usa <code>object-fit: cover</code> para mantener el encuadre de las imágenes.</p>
<div class="galeria">
    <div class="img-container"><img src="../../../img/product.png" class="img-responsive" alt="Gal1"></div>
    <div class="img-container"><img src="../../../img/product.png" class="img-responsive" alt="Gal2"></div>
    <div class="img-container"><img src="../../../img/product.png" class="img-responsive" alt="Gal3"></div>
    <div class="img-container"><img src="../../../img/product.png" class="img-responsive" alt="Gal4"></div>
    <div class="img-container"><img src="../../../img/product.png" class="img-responsive" alt="Gal5"></div>
</div>
</body>
</html>
