<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T8_Ej3: Navbar Fluida</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .navbar {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-color: #212529;
    padding: 15px;
}
.nav-brand { color: white; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
.nav-links { display: flex; flex-direction: column; width: 100%; gap: 10px; }
.nav-links a { color: #f8f9fa; text-decoration: none; text-align: center; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 4px; }

@media (min-width: 768px) {
    .navbar { flex-direction: row; justify-content: space-between; }
    .nav-brand { margin-bottom: 0; }
    .nav-links { flex-direction: row; width: auto; gap: 20px; }
    .nav-links a { background: transparent; padding: 0; }
    .nav-links a:hover { color: #0dcaf0; }
}
    </style>
</head>
<body>
    <nav class="navbar">
    <div class="nav-brand">MiApp</div>
    <div class="nav-links">
        <a href="#">Inicio</a>
        <a href="#">Características</a>
        <a href="#">Planes</a>
        <a href="#">Contacto</a>
    </div>
</nav>
<div style="padding: 20px; text-align:center;">Comprueba el menú apilado vs barra superior al cambiar de ancho.</div>
</body>
</html>
