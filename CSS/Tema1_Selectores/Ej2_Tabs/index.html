<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T1_Ej2: Tabs Custom</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .tabs { display: flex; list-style: none; padding: 0; margin: 0; border-bottom: 2px solid #dee2e6; width: 100%; }
.tab { flex: 1; text-align: center; padding: 15px; cursor: pointer; color: #495057; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab:hover { background-color: #f1f3f5; }
.tab.active { color: #0d6efd; border-bottom-color: #0d6efd; font-weight: bold; }
    </style>
</head>
<body>
    <ul class="tabs">
    <li class="tab active">Activa</li>
    <li class="tab">Sección 2</li>
    <li class="tab">Sección 3</li>
    <li class="tab">Sección 4</li>
</ul>
</body>
</html>
