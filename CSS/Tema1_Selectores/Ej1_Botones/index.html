<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T1_Ej1: Botones Custom</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .btn { border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; color: white; background-color: #0d6efd; margin-bottom:10px; }
.btn-lg { padding: 15px 30px; font-size: 20px; }
.btn-outline { background-color: transparent; color: #0d6efd; border: 2px solid #0d6efd; }
.btn-block { width: 100%; display: block; }
.btn-group { display: inline-flex; }
.btn-group .btn { border-radius: 0; border-right: 1px solid #0a58ca; margin-bottom:0; }
.btn-group .btn:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.btn-group .btn:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; border-right: none; }
    </style>
</head>
<body>
    <button class="btn btn-lg">Botón Grande</button><br>
<button class="btn btn-outline">Botón Outline</button><br>
<button class="btn btn-block">Botón Ancho Completo</button><br>
<div class="btn-group">
    <button class="btn">Izquierda</button>
    <button class="btn">Medio</button>
    <button class="btn">Derecha</button>
</div>
</body>
</html>
