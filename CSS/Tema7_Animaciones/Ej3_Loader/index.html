<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T7_Ej3: Loader Animado</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .loader-container { display: flex; justify-content: center; align-items: center; height: 200px; }
.loader {
    width: 60px;
    height: 60px;
    border: 8px solid #f3f3f3;
    border-top: 8px solid #0d6efd;
    border-radius: 50%;
    animation: spin-color 2s linear infinite alternate;
}
.loader:hover { animation-play-state: paused; }
@keyframes spin-color {
    0% { transform: rotate(0deg); border-top-color: #0d6efd; }
    50% { border-top-color: #198754; }
    100% { transform: rotate(360deg); border-top-color: #dc3545; }
}
    </style>
</head>
<body>
    <div class="loader-container">
    <div class="loader" title="Hover para pausar"></div>
</div>
</body>
</html>
