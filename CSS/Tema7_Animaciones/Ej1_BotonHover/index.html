<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T7_Ej1: Botón Animado</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .btn-animated {
    padding: 15px 30px;
    font-size: 18px;
    color: white;
    background-color: #0d6efd;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    transition-delay: 0.1s;
}
.btn-animated:hover {
    background-color: #198754;
    transform: scale(1.1);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
}
    </style>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
    <button class="btn-animated">Hover Me</button>
</div>
</body>
</html>
