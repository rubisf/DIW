<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T5_Ej5: Flex Wrap</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .wrap-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    width: 300px;
    background-color: #e9ecef;
    padding: 15px;
    border-radius: 8px;
}
.wrap-item { flex: 1 1 80px; background-color: #198754; color: white; height: 60px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <p>Contenedor de 300px. Cajas base 80px.</p>
<div class="wrap-container">
    <div class="wrap-item">1</div><div class="wrap-item">2</div><div class="wrap-item">3</div>
    <div class="wrap-item">4</div><div class="wrap-item">5</div><div class="wrap-item">6</div>
    <div class="wrap-item">7</div>
</div>
</body>
</html>
