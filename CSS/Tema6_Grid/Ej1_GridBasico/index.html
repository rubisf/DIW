<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T6_Ej1: Grid Básico fr</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .grid-container {
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: auto auto;
    gap: 15px;
    background-color: #ced4da;
    padding: 20px;
    border-radius: 8px;
}
.grid-item { background-color: #0dcaf0; padding: 20px; font-weight: bold; text-align: center; border-radius: 4px; }
    </style>
</head>
<body>
    <p>Columnas: 1fr 2fr 1fr</p>
<div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2 (Doble)</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
</div>
</body>
</html>
