<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_T4_Ej1: Display</title>
    <style>
        body {{ font-family: system-ui, sans-serif; padding: 20px; background-color: #f8f9fa; color: #333; }}
        .caja { padding: 10px; background-color: coral; color: white; display: block; margin-bottom: 20px; width: 200px; }
.inline { display: inline; background-color: lightgreen; color: black; padding: 10px; width: 300px; /* Width es ignorado en inline */ }
.inline-block { display: inline-block; background-color: skyblue; color: black; padding: 10px; width: 200px; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="caja">Display Block</div>
<span class="inline">Display Inline 1</span><span class="inline">Display Inline 2</span><br><br>
<div class="inline-block">Display Inline Block 1</div><div class="inline-block">Display Inline Block 2</div>
</body>
</html>
