<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resolución de Ejercicios - CSS Puro</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Native CSS */
        .sidebar {
            width: 280px;
            min-width: 280px;
            background: white;
            border-right: 1px solid #dee2e6;
            overflow-y: auto;
            padding: 20px 10px;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: bold;
            padding: 10px;
            color: #0d6efd;
            display: block;
            border-bottom: 2px solid #0d6efd;
            margin-bottom: 15px;
        }

        .theme-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #6c757d;
            font-weight: bold;
            margin: 15px 0 5px 10px;
        }

        .nav-link {
            display: block;
            padding: 8px 15px;
            color: #495057;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 2px;
            font-size: 14px;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-link:hover {
            background-color: #e9ecef;
        }

        .nav-link.active {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        /* Main View */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            background: #f8f9fa;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-bar h3 {
            margin: 0;
            color: #212529;
        }

        .btn-link {
            display: inline-block;
            padding: 6px 12px;
            font-size: 14px;
            color: #0d6efd;
            border: 1px solid #0d6efd;
            border-radius: 4px;
            text-decoration: none;
            transition: 0.2s;
            background: white;
        }

        .btn-link:hover {
            background: #0d6efd;
            color: white;
        }

        .iframe-container {
            flex: 1;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background: white;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="navbar-brand">Ejercicios CSS Puro</div>

            <div class="theme-title">Tema 1: Selectores</div>
            <button class="nav-link active" data-url="Tema1_Selectores/Ej1_Botones/index.html"

        <!-- Main Workspace -->

            <div class="header-bar">

                <iframe id="viewer" src="Tema1_Selectores/Ej1_Botones/index.html"></iframe>
            </div>

    </div>

    <script>
        function loadIframe(element) {
            // Actualizar active state
            document.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // Cargar URL
            const url = element.getAttribute('data-url');
            document.getElementById('viewer').src = url;

            // Actualizar UI
            document.getElementById('currentTitle').innerText = element.innerText;
            document.getElementById('extLink').href = url;
        }
    </script>
