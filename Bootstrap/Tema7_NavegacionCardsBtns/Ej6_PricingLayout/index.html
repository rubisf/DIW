<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_T7_Ej6_Pricing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        
    </style>
</head>
<body>
    <div class="container py-5">
    <div class="pricing-header p-3 pb-md-4 mx-auto text-center">
        <h1 class="display-4 fw-normal">Precios</h1>
        <p class="fs-5 text-muted">Ejemplo de tabla de precios construida con Bootstrap cards.</p>
        <div class="btn-group mt-3"><button class="btn btn-primary active">Mensual</button><button class="btn btn-outline-primary">Anual</button></div>
    </div>
    <div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
        <div class="col"><div class="card mb-4 rounded-3 shadow-sm">
            <div class="card-header py-3"><h4 class="my-0 fw-normal">Gratis</h4></div>
            <div class="card-body"><h1 class="card-title pricing-card-title"><small class="text-muted fw-light">/mo</small></h1><ul class="list-unstyled mt-3 mb-4"><li>10 users</li><li>2 GB storage</li></ul><button type="button" class="w-100 btn btn-lg btn-outline-primary">Sign up</button></div>
        </div></div>
        <div class="col"><div class="card mb-4 rounded-3 shadow border-primary">
            <div class="card-header py-3 text-white bg-primary border-primary"><h4 class="my-0 fw-normal">Pro</h4></div>
            <div class="card-body"><h1 class="card-title pricing-card-title"><small class="text-muted fw-light">/mo</small></h1><ul class="list-unstyled mt-3 mb-4"><li>20 users</li><li>10 GB storage</li></ul><button type="button" class="w-100 btn btn-lg btn-primary">Get started</button></div>
        </div></div>
        <div class="col"><div class="card mb-4 rounded-3 shadow-sm">
            <div class="card-header py-3"><h4 class="my-0 fw-normal">Enterprise</h4></div>
            <div class="card-body"><h1 class="card-title pricing-card-title"><small class="text-muted fw-light">/mo</small></h1><ul class="list-unstyled mt-3 mb-4"><li>30 users</li><li>15 GB storage</li></ul><button type="button" class="w-100 btn btn-lg btn-primary">Contact us</button></div>
        </div></div>
    </div>
</div>
</body>
</html>
