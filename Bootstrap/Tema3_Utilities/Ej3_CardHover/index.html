<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_T3_Ej3: Card bg-warning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; }
        
    </style>
</head>
<body>
    <!-- Nota: hover:bg-warning-subtle no es nativo en BS5 utilities estándar sin custom CSS o SCSS. Lo simulamos con hover personalizado o transition básica -->
<style>.card-hover:hover { background-color: #fff3cd !important; transition: 0.3s; cursor: pointer; }</style>
<div class="card bg-warning text-dark p-4 rounded-3 card-hover" style="max-width:300px;">
    <h5>Card Interactivo</h5>
    <p>Card con bg-warning, padding 4, rounded-3. Tiene hover personalizado imitando subtle.</p>
</div>
</body>
</html>
