<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_T8_Ej5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        
    </style>
</head>
<body>
    <div class="container mt-5 p-4 bg-white shadow rounded">
    <form class="row g-3 was-validated">
        <div class="col-md-4">
            <label for="val1" class="form-label">Nombre</label>
            <input type="text" class="form-control is-valid" id="val1" value="Mark" required>
            <div class="valid-feedback">¡Correcto!</div>
        </div>
        <div class="col-md-4">
            <label for="val2" class="form-label">Usuario</label>
            <div class="input-group has-validation">
                <span class="input-group-text" id="inputGroupPrepend">@</span>
                <input type="text" class="form-control is-invalid" id="val2" aria-describedby="inputGroupPrepend" required>
                <div class="invalid-feedback">Por favor, elige un nombre de usuario válido.</div>
            </div>
        </div>
        <div class="col-12">
            <button class="btn btn-primary" type="submit">Validar formulario</button>
        </div>
    </form>
</div>
</body>
</html>
