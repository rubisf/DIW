<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_T8_Ej6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        
    </style>
</head>
<body>
    <div class="container mt-5 p-5 bg-white shadow rounded">
    <h2 class="mb-4 text-center">Registro de Usuario</h2>
    <form class="row g-3 needs-validation" novalidate onsubmit="event.preventDefault(); this.classList.add('was-validated');">
        <div class="col-md-6 form-floating mb-3">
            <input type="text" class="form-control" id="floatingName" placeholder="Nombre completo" required>
            <label for="floatingName" class="ps-4">Nombre completo</label>
            <div class="invalid-feedback">Requerido.</div>
        </div>
        <div class="col-md-6 form-floating mb-3">
            <select class="form-select" id="floatingSelect" required>
                <option selected disabled value="">Elige Rol...</option>
                <option value="1">Admin</option>
                <option value="2">User</option>
            </select>
            <label for="floatingSelect" class="ps-4">Selecciona un rol</label>
            <div class="invalid-feedback">Selecciona un rol.</div>
        </div>
        <div class="col-md-12">
            <div class="input-group has-validation mb-3">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <div class="form-floating flex-grow-1">
                    <input type="email" class="form-control border-start-0 ps-3 rounded-none rounded-end" id="floatingEmailGroup" placeholder="name@example.com" required>
                    <label for="floatingEmailGroup">Email address</label>
                </div>
                <div class="invalid-feedback">Introduce un email válido.</div>
            </div>
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                <label class="form-check-label" for="invalidCheck">Acepto condiciones de uso</label>
                <div class="invalid-feedback">Debes aceptar antes de enviar.</div>
            </div>
        </div>
        <div class="col-12 text-end mt-4">
            <button class="btn btn-secondary me-2" type="button">Cancelar</button>
            <button class="btn btn-success px-4" type="submit">Registrarse</button>
        </div>
    </form>
</div>
</body>
</html>
