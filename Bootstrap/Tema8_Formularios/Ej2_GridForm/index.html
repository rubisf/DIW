<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B_T8_Ej2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body { padding: 20px; background-color: #f8f9fa; }
        
    </style>
</head>
<body>
    <div class="container mt-5 p-4 bg-white shadow rounded">
    <h3 class="mb-4">Formulario con Grid</h3>
    <form class="row g-3">
        <div class="col-md-6">
            <label for="pais" class="form-label">País</label>
            <select id="pais" class="form-select">
                <option selected>Elige...</option>
                <option value="1">España</option>
                <option value="2">México</option>
                <option value="3">Argentina</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label d-block">Tipo de usuario</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="tipo" id="inlineRadio1" value="particular">
                <label class="form-check-label" for="inlineRadio1">Particular</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="tipo" id="inlineRadio2" value="empresa">
                <label class="form-check-label" for="inlineRadio2">Empresa</label>
            </div>
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="condiciones">
                <label class="form-check-label" for="condiciones">Acepto los términos y condiciones</label>
            </div>
        </div>
        <div class="col-12"><button type="submit" class="btn btn-primary">Registrar</button></div>
    </form>
</div>
</body>
</html>
