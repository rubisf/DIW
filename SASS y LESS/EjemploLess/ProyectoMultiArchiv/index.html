<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LESS - Modularización real con varios archivos</title>

  <!-- Vinculamos el archivo principal LESS -->
  <link rel="stylesheet/less" type="text/css" href="main.less" />
  <script src="https://cdn.jsdelivr.net/npm/less@4"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
  </style>
</head>
<body>
  <h1>Ejemplo 7️⃣ - Modularización en LESS</h1>
  <p>Este ejemplo muestra cómo organizar LESS en módulos separados:</p>
  <ul>
    <li><code>variables.less</code></li>
    <li><code>mixins.less</code></li>
    <li><code>componentes.less</code></li>
    <li><code>main.less</code></li>
  </ul>

  <button class="boton-verde">Botón verde</button>
  <button class="boton-oscuro">Botón oscuro</button>
</body>
</html>
